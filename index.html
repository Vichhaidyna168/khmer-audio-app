
<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khmer Audio Generator</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; background-color: #f4f7f6; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #333; text-align: center; margin-top: 0; }
        textarea { width: 100%; height: 120px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; }
        select, button { width: 100%; padding: 12px; margin-top: 12px; border-radius: 8px; border: none; font-size: 16px; }
        select { border: 1px solid #ccc; background: white; }
        button { background-color: #007bff; color: white; font-weight: bold; cursor: pointer; }
        audio { width: 100%; margin-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h2>🎙️ បម្លែងអក្សរទៅជាសំឡេងខ្មែរ (Edge TTS - Free)</h2>
    
    <label><b>បញ្ចូលអត្ថបទខ្មែរ៖</b></label>
    <textarea id="textInput" placeholder="វាយ ឬ Paste អត្ថបទខ្មែរនៅទីនេះ..."></textarea>

    <label><b>ជ្រើសរើសសំឡេង៖</b></label>
    <select id="voiceSelect">
        <option value="km-KH-PisethNeural">សំឡេងប្រុស (Piseth)</option>
        <option value="km-KH-SreymomNeural">សំឡេងស្រី (Sreymom)</option>
    </select>

    <button onclick="generateSpeech()">🔊 បម្លែងទៅជាសំឡេង MP3</button>

    <div id="result" style="display:none;">
        <h3 style="margin-bottom:5px;">សំឡេងដែលបានបង្កើត៖</h3>
        <audio id="audioPlayer" controls></audio>
    </div>
</div>

<script>
async function generateSpeech() {
    const text = document.getElementById('textInput').value;
    const voice = document.getElementById('voiceSelect').value;
    
    if (!text) {
        alert('សូមបញ្ចូលអត្ថបទជាមុនសិន!');
        return;
    }

    const button = document.querySelector('button');
    button.innerText = '⏳ កំពុងបង្កើតសំឡេង...';
    button.disabled = true;

    try {
        const url = `https://api.streamelements.com/kappa/v2/speech?voice=${voice}&text=${encodeURIComponent(text)}`;
        const audioPlayer = document.getElementById('audioPlayer');
        audioPlayer.src = url;
        
        document.getElementById('result').style.display = 'block';
        audioPlayer.play();
    } catch (error) {
        alert('មានបញ្ហាក្នុងការបង្កើតសំឡេង សូមសាកល្បងម្តងទៀត!');
    } finally {
        button.innerText = '🔊 បម្លែងទៅជាសំឡេង MP3';
        button.disabled = false;
    }
}
</script>

</body>
</html>
